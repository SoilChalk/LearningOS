protocol_version: 20

# Execution manifest — describes ONLY the agent execution boundary for the
# active work item. Human-facing problem/outcome lives in the Issue and PR.
# GitHub (Issue/PR numbers, merged_at, merge SHA, review lifecycle) is the
# authoritative change record; it is NOT duplicated here.

task_id: task-005-repository-baseline
status: ready
branch: chore/repository-baseline
result_file: agent-control/results/task-005.json

lifecycle:
  previous_agent_execution: in_progress
  technical_completion: candidate_complete
  reviewer_acceptance: pending
  latest_reviewer_record: pending
  owner_acceptance: pending
  lifecycle_status: submitted_for_review
  formal_closure: false
  task_005_status: submitted_for_review

owner_authorization:
  recorded_at: "2026-08-10T14:37:00+0800"
  source_instruction: "Owner-directed bounded Git/version-management baseline migration (single authorization message 2026-08-10, session 714c3b77-38a4-40e1-81b6-77ebe42a656a): adopt Issue -> short-lived branch -> meaningful commits -> PR -> deterministic CI + review -> squash merge -> clean main; remove agent-control lifecycle pollution of Git history."
  scope: >
    Bounded repository baseline. Repository-facing: public README,
    docs/PROJECT_HISTORY.md (reconstructed, real records only),
    docs/DEVELOPMENT.md (short workflow + local git config recommendation),
    .github/PULL_REQUEST_TEMPLATE.md, deterministic .github/workflows/ci.yml
    (no LLM), minimal requirements.txt. Agent protocol migration: rewrite
    AGENTS.md and agent-control/TASK_PROTOCOL.md to the 16-rule new model
    (main is trusted product state, short-lived branches, Issue = human-facing
    problem, task contract = execution manifest only, meaningful commits,
    PR = change/review record, CI separated from semantic reviewer, squash
    merge default, delete branch after merge, standing delegation within Gate 3
    scope, ESCALATE only on genuine human/product/security/architecture
    boundaries, no post-merge lifecycle bookkeeping commits to main, no
    GitHub lifecycle mirror in source control, CURRENT_TASK as execution
    manifest, CURRENT_STATE as product/experiment state, agent orchestration
    history must not crowd product history). Shrink CURRENT_TASK.yaml /
    CURRENT_STATE.yaml accordingly and make check_control_state.py /
    test_control_state.sh task-generic. NO history rewrite, NO commitlint /
    Husky / semantic-release / CODE_OF_CONDUCT / governance framework / hooks
    framework / new controller, NO retroactive releases, NO new product
    feature.

allowed_paths:
  - README.md
  - docs/PROJECT_HISTORY.md
  - docs/DEVELOPMENT.md
  - .github/PULL_REQUEST_TEMPLATE.md
  - .github/workflows/ci.yml
  - requirements.txt
  - AGENTS.md
  - agent-control/TASK_PROTOCOL.md
  - agent-control/CURRENT_TASK.yaml
  - agent-control/results/task-005.json
  - state/CURRENT_STATE.yaml
  - scripts/check_control_state.py
  - scripts/test_control_state.sh

forbidden_paths:
  - templates/**
  - sources/**
  - docs/FIRST_VERTICAL_SCENARIO.md
  - docs/PEDAGOGICAL_ACTION_DECISION_TREE.md
  - docs/DESIGN_GATES.md
  - docs/REFERENCE_SYSTEM_MATRIX.md
  - docs/RESEARCH_QUESTIONS.md
  - agent-control/results/task-001*.json
  - agent-control/results/task-002*.json
  - agent-control/results/task-003*.json
  - agent-control/results/task-004*.json
  - scripts/learning_state.py
  - scripts/test_learning_state.py
  - scripts/pilot_session.py
  - scripts/test_pilot_session.py
  - scripts/validate_task_002.py
  - scripts/test_task_002_negative.sh
  - scripts/validate_source_records.py
  - scripts/test_validation_negative.sh
  - .github/workflows/executor.md
  - .github/workflows/reviewer.md
  - .github/workflows/agentics-maintenance.yml
  - .github/workflows/*.lock.yml

acceptance_commands:
  - bash -c 'for f in scripts/*.py; do python3 -m py_compile "$f" || exit 1; done'
  - python3 scripts/test_learning_state.py
  - python3 scripts/test_pilot_session.py
  - python3 scripts/validate_task_002.py
  - python3 scripts/validate_source_records.py
  - bash scripts/test_task_002_negative.sh
  - bash scripts/test_validation_negative.sh
  - bash scripts/test_control_state.sh
  - python3 -m json.tool agent-control/results/task-005.json >/dev/null
  - python3 -m json.tool sources/source-ledger.json >/dev/null

completion_conditions:
  - All acceptance commands exit 0.
  - README is public-facing and current.
  - docs/PROJECT_HISTORY.md exists with the reconstruction label and real records.
  - docs/DEVELOPMENT.md defines the new default workflow + local git config.
  - .github/PULL_REQUEST_TEMPLATE.md exists and is concise.
  - Deterministic CI workflow exists and runs no LLM.
  - requirements.txt declares only actually-used dependencies.
  - AGENTS.md and TASK_PROTOCOL.md reflect the 16-rule model.
  - CURRENT_TASK.yaml / CURRENT_STATE.yaml are lean (no GitHub lifecycle mirror).
  - No history rewritten, no fabricated records, no new governance runtime.

stop_conditions:
  - Two consecutive tool failures (per TASK_PROTOCOL.md).
  - A declared blocker prevents safe completion.

inputs:
  - Existing git history / Issues / PRs (read-only evidence)
  - Existing scripts tests (read-only; only check_control_state.py and
    test_control_state.sh may be modified per objective)
