repair_requirements:
  repair_1_json_schema_validation:
    description: >
      Resolve JSON Schema validation capability. If jsonschema unavailable,
      mark blocked. If available, use Draft7Validator for instance tests.
    required_checks:
      - Check jsonschema availability
      - Record exact installed version
      - Do not download or update
      - If unavailable: status blocked, stop

  repair_2_instance_validation_tests:
    description: >
      Add real instance validation tests using jsonschema.Draft7Validator
    required_tests:
      positive_a: cannot_articulate + null obstacle + in_scope + request_explanation + citations
      positive_b: stop + missing_required_material + empty citations + stop_reason
      positive_c: stop + outside_supplied_corpus + empty citations + stop_reason
      negative_a: stop + in_scope + empty citations + stop_reason (invalid)
      negative_b: stop + missing_required_material + empty citations + no stop_reason
      negative_c: request_explanation + empty citations (source-grounded without citations)
    requirements:
      - Validate complete state instances against actual schema
      - Do not substitute with structural inspection
      - All tests must execute and pass

  repair_3_machine_derived_counts:
    description: Make test counts machine-derived, not hardcoded
    requirements:
      - Maintain separate counters (positive_test_count, negative_test_count, total_test_count)
      - Every helper increments appropriate counter
      - Final summary generated from counters
      - Fail unless all named Protocol 19 tests execute and pass
      - Final report lists every test by name

  repair_4_correct_allowlist:
    description: Replace cumulative allowlist with protocol-baseline check
    requirements:
      - Protocol check: git diff --name-only aeddd893...HEAD (must be exit_code 0)
      - Cumulative inventory: git diff --name-only origin/main...HEAD (informational)
      - Record both distinctly: protocol_changed_paths, pr_cumulative_changed_paths
      - Protocol allowlist must return exit_code 0

  repair_5_correct_timestamps:
    description: Remove future timestamps, use only Git metadata
    requirements:
      - Remove 2026-08-05T09:00:00+08:00, 2026-08-05T10:00:00+08:00
      - C1 substantive commit timestamp from Git metadata
      - completion_commit and completed_at use C1 timestamp
      - timestamp_source: git_committer_metadata
      - No invented rounded times or future times

  repair_6_correct_result_record:
    description: Update task-002.json with Protocol 19 metadata
    requirements:
      - Protocol 19 task ID and baseline
      - Distinguish protocol_changed_paths from pr_cumulative_changed_paths
      - Record actual jsonschema version
      - Record each named instance test and result
      - Machine-derived positive/negative/total counts
      - Every final validation command and actual exit code
      - all_acceptance_commands_passed true only if every command returns 0
      - No claim failed command is acceptable
      - No stale Protocol 16/17/18 wording
      - Reviewer acceptance pending, Gate 3 not started

acceptance_commands:
  - python3 -m json.tool templates/MINIMAL_LEARNING_STATE.schema.json >/dev/null
  - python3 -m json.tool agent-control/results/task-002.json >/dev/null
  - python3 scripts/validate_task_002.py
  - bash scripts/test_task_002_negative.sh
  - python3 scripts/check_control_state.py
  - git diff --check
  - grep -q '^# First Vertical Scenario' docs/FIRST_VERTICAL_SCENARIO.md
  - grep -q '^# Pedagogical Action Decision Tree' docs/PEDAGOGICAL_ACTION_DECISION_TREE.md
  - >
    python3 - <<'PY'
    import subprocess, sys
    allowed = {
        'agent-control/CURRENT_TASK.yaml',
        'docs/DESIGN_GATES.md',
        'templates/MINIMAL_LEARNING_STATE.schema.json',
        'scripts/validate_task_002.py',
        'scripts/test_task_002_negative.sh',
        'state/CURRENT_STATE.yaml',
        'agent-control/results/task-002.json',
    }
    baseline = 'aeddd893147fc3de30135ff9bece58b113257198'
    changed = set(subprocess.check_output(
        ['git', 'diff', '--name-only', f'{baseline}...HEAD'], text=True
    ).splitlines())
    bad = sorted(changed - allowed)
    if bad:
        print('\n'.join(bad))
        sys.exit(1)
    PY

completion_conditions:
  - jsonschema dependency available or task marked blocked
  - minimum 6 instance validation tests (3 positive + 3 negative) execute and pass
  - test counts machine-derived from actual test execution
  - protocol allowlist check against baseline returns exit_code 0
  - no future or fabricated timestamps
  - result record has Protocol 19 metadata and actual command exits
  - all acceptance commands pass with exit_code 0
  - all three authority files aligned to candidate_complete
  - PR #3 body reflects Protocol 19
  - PR #3 remains Draft, open, unmerged

