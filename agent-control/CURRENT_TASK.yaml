protocol_version: 4

task_id: task-001-core-research
status: changes_requested
branch: agent/task-001-core-research
pull_request: 2

objective: >
  Complete a public, non-sensitive core research ledger for Learning OS covering
  source grounding, course/task boundaries, pedagogical action selection,
  learning-behavior evidence, and learner-model applicability.

context:
  authoritative_issue: https://github.com/SoilChalk/LearningOS/issues/1
  review_target: https://github.com/SoilChalk/LearningOS/pull/2
  note: >
    PR web access is optional. This file is the executable Review 02 contract.
    Task 001 is in progress. Gate 1 is not complete.

allowed_paths:
  - AGENTS.md
  - agent-control/**
  - docs/**
  - sources/**
  - templates/**
  - state/**
  - scripts/**

forbidden_paths:
  - private/**
  - personal/**
  - raw-course-materials/**
  - .env
  - "**/*.key"
  - "**/*secret*"
  - "**/*token*"

current_truth:
  task_status: in_progress
  gate_1_status: not_met
  verified_source_count: 5
  minimum_source_count: 8
  verified_source_ids:
    - src-001
    - src-002
    - src-003
    - src-004
    - src-005
  removed_evidence_ids:
    - src-006
    - src-007
    - src-008

review_cycle:
  review_id: task-001-review-02
  decision: changes_requested
  required_changes:
    - >
      Rebuild docs/REFERENCE_SYSTEM_MATRIX.md entirely from the current five-source
      ledger. Its header still says eight verified sources and it still cites
      removed src-006, src-007, and src-008. Remove those evidence rows and claims.
      Deferred candidates may appear only in an explicitly labeled deferred section.
    - >
      Scope negative gap claims to the reviewed sample. Replace claims such as
      "No system found" with "Not observed in the five verified sources reviewed
      so far" unless a systematic search supports a broader conclusion.
    - >
      Correct all LearnLM percentile wording. Use: "moved from the 50th to the
      64th percentile (a difference of 14 percentile ranks/positions)". Do not use
      "14 percentage points" or "+14 percentile points" anywhere.
    - >
      Downgrade Study Mode claims. The official page documents available behaviors
      and explicit user requests, but does not prove that pedagogical selection
      requires explicit user control or that Socratic behavior is technically
      opt-in/default-off. Keep the documented interface behavior as direct evidence;
      label policy conclusions as design inference.
    - >
      Fix schema architecture. sources/source-ledger.json currently points its
      $schema field at a single-record schema although the ledger root is not one
      record. Create templates/SOURCE_LEDGER.schema.json whose sources.items refers
      to templates/SOURCE_RECORD.json, and point the ledger to the ledger schema.
    - >
      Add deterministic schema validation. Prefer scripts/validate_source_records.py
      using a real JSON Schema validator. It must validate the ledger root and each
      source record, return nonzero on failure, and be recorded in task-001.json.
    - >
      Keep Stage 2 in progress and Gate 1 not met. Stage 3 may be marked complete
      only after the matrix is rebuilt from the current ledger. Do not claim Task
      completion while the source count is below eight.
    - >
      Ensure task-001.json, CURRENT_STATE.yaml, DESIGN_GATES.md, the matrix, ledger,
      and PR body all agree on in_progress, five verified sources, and Gate 1 not met.

required_outputs:
  - docs/RESEARCH_QUESTIONS.md
  - docs/REFERENCE_SYSTEM_MATRIX.md
  - docs/DESIGN_GATES.md
  - sources/source-ledger.json
  - templates/SOURCE_RECORD.json
  - templates/SOURCE_LEDGER.schema.json
  - scripts/validate_source_records.py
  - state/CURRENT_STATE.yaml
  - agent-control/results/task-001.json

source_requirements:
  minimum_count: 8
  maximum_count: 15
  rules:
    - Product pages support feature claims, not learning-effect claims.
    - Search snippets cannot substitute for reading the source body.
    - Placeholder or aggregate URLs are invalid source URLs.
    - Dates, metrics, and current product claims require an access date.
    - Individual reports must not be generalized into population claims.
    - Prefer eight strong sources over weak sources added to satisfy the count.

acceptance_commands:
  - python3 -m json.tool sources/source-ledger.json >/dev/null
  - python3 -m json.tool templates/SOURCE_RECORD.json >/dev/null
  - python3 -m json.tool templates/SOURCE_LEDGER.schema.json >/dev/null
  - python3 scripts/validate_source_records.py
  - find . -maxdepth 3 -type f | sort
  - "! grep -R -nE 'Sources: 8 verified|src-006|src-007|src-008|\\+14 percentile points|14 percentile point gain' docs sources state agent-control/results"

review_02_acceptance:
  - Matrix contains only current verified evidence rows.
  - Deleted source IDs occur only in explicitly labeled deferred or removed-history records.
  - No ambiguous percentile-point terminology remains.
  - Study Mode observations and design inferences are separated.
  - Ledger root and source records pass deterministic schema validation.
  - All status-bearing files report in_progress, five verified sources, and Gate 1 not met.
  - PR remains draft and Task 002 is not started.

stop_conditions:
  - same_required_operation_fails_twice_after_declared_fallback_and_no_equivalent_alternative_exists
  - required_research_dimension_has_no_accessible_primary_or_high_quality_survey_after_three_distinct_candidates
  - repository_state_cannot_be_persisted_after_two_attempts
  - task_requires_modifying_a_forbidden_path
  - requested_content_is_not_suitable_for_a_public_repository

completion_process:
  - Merge origin/main into the existing task branch without discarding task work.
  - Apply review_cycle.required_changes only.
  - Run every acceptance command and record exact exit codes.
  - Push the existing branch so Draft PR #2 updates.
  - Stop without merging or starting Task 002.
