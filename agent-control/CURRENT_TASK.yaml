    supports:
      - knowledge_state_estimation_from_structured_exercise_interactions
      - side_information_and_temporal_variants
      - knowledge_tracing_model_taxonomy
      - adaptive_learning_applications
    does_not_support:
      - user_material_source_grounding
      - unified_model_across_reading_debugging_and_exercises
      - millions_of_knowledge_states_claim
  src_007:
    supports:
      - learner_model_transparency
      - inspectable_negotiable_editable_adaptive_olm_categories
      - self_regulated_learning_scaffolding
      - learner_agency_and_feedback
    does_not_support:
      - source_bound_content_attribution
      - user_material_grounding_plus_learner_model_integration
      - direct_resolution_of_cross_task_model_unification
  src_008:
    supports:
      - behavioral_trace_feature_engineering
      - course_outcome_and_risk_prediction
      - prediction_timing_interpretability_equity_and_privacy
    does_not_support:
      - conceptual_mastery_state_estimation
      - knowledge_tracing_state
      - direct_resolution_of_cross_task_model_unification
      - intervention_effectiveness

