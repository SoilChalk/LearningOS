  source_instruction: "Issue #14 (VS Code-native LearningOS interaction surface) under the Gate-scoped standing delegation + new Git workflow (Issue -> branch -> PR -> CI -> review -> squash). One learner intent -> first real learning action."
  scope: >
    Add a perceivable, native LearningOS entry point in VS Code Chat via a
    custom agent (.github/agents/learningos.agent.md). No extension, WebView,
    telemetry, MCP server, scheduler, knowledge graph, learner model, or
    custom orchestration. The agent encodes the friction-reduction interaction
    discipline (one intent -> first action; silent operational work; bundled
