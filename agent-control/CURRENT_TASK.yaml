required_changes:
  - >
    Fix `scripts/check_control_state.py` YAML parser to handle same-level indentation
    correctly. The current parser fails when multiple keys at the same indentation
    level follow a nested section. Ensure it can parse CURRENT_TASK.yaml, CURRENT_STATE.yaml,
    and task-001.json lifecycle sections correctly.
  - >
    Extend `scripts/check_control_state.py` to validate correct status semantics and
    lifecycle field agreement. Top-level status fields have different semantics:
    CURRENT_TASK.yaml status must equal awaiting_owner_decision; CURRENT_STATE.yaml
    status remains complete; task-001.json status remains complete. Do not require
    these three top-level status fields to be equal. The following eight lifecycle
    fields must agree across CURRENT_TASK.yaml truth_to_preserve, CURRENT_STATE.yaml
    lifecycle, and task-001.json lifecycle: previous_agent_execution, technical_completion,
    reviewer_acceptance, latest_reviewer_record, owner_acceptance, lifecycle_status,
    formal_closure, task_002_status. Expected values: cancelled_after_commit_and_push,
    candidate_complete, accepted, task-001-review-12, pending, awaiting_owner_decision,
    false, not_started.
  - >
    Expand `scripts/test_control_state.sh` negative tests to prove the checker returns
    nonzero for all invalid states. Require at least 9 negative tests: CURRENT_TASK
    status is not awaiting_owner_decision; previous_agent_execution mismatch;
    technical_completion mismatch; reviewer_acceptance mismatch; latest_reviewer_record
    mismatch; owner_acceptance mismatch; lifecycle_status mismatch; formal_closure
    mismatch; task_002_status mismatch. Each test must mutate fixture copies or
    temporary files, invoke the production checker, and prove nonzero exit. The
    negative-test script must not duplicate the checker implementation.
  - >
    Preserve the existing Protocol 10 result field `completed_at: "2026-07-30T14:24:53Z"`
    in `agent-control/results/task-001-control-plane-repair.json`. Do not add a
    duplicate repair_completed_at field to the result JSON. The result already
    records the actual completion timestamp.
  - >
    In `state/CURRENT_STATE.yaml`, update `next_action.action` to reflect
    awaiting_owner_decision state: remove "ready for Task 002 initiation" language;
    state explicitly that owner acceptance is pending and Task 002 is not started.
  - >
    In `agent-control/results/task-001.json`, update `next_action` to reflect
    awaiting_owner_decision state: remove "ready for Task 002" language; state
    explicitly that owner acceptance is pending and Task 002 is not started.
  - >
    Update GitHub PR #2 body with the actual lifecycle state and current remote HEAD
    (2c82f65 or later). Include: previous agent execution cancelled_after_commit_and_push,
    technical completion candidate_complete, reviewer accepted, owner acceptance pending,
    lifecycle awaiting_owner_decision, formal_closure false, PR Draft/open/unmerged,
    Task 002 not_started. Do not change PR Draft status, do not merge or close PR.
  - >
    After all validation passes and the task branch is pushed, switch to main branch,
    pull latest, replace `agent-control/CURRENT_TASK.yaml` with the non-executable
    awaiting_owner_decision template. The restored template must record Protocol 10
    repair completion at `control_plane_repair.repair_completed_at: "2026-07-30T14:24:53Z"`.
    It must also record Protocol 11 finalization separately with its actual completion
    timestamp and result-file reference (`control_plane_finalization.finalization_completed_at`
    and `finalization_result_file`). Task ID: task-001-core-research, status:
    awaiting_owner_decision, no allowed paths, awaiting owner authorization. Commit
    "Restore CURRENT_TASK to awaiting state after Protocol 11" and push main to prevent
    new agents from re-executing Protocol 10/11.
  - >
    Write the declared finalization result JSON with actual commands, exit codes,
    baseline head, files changed, lifecycle state, and completion timestamp. State
    that Protocol 10+11 control-plane work is candidate complete, awaiting owner decision;
    do not claim formal task closure.

task_branch_acceptance_commands:
  - python3 -m json.tool agent-control/results/task-001.json >/dev/null
  - python3 -m json.tool agent-control/results/task-001-control-plane-repair.json >/dev/null
  - python3 -m json.tool agent-control/results/task-001-control-plane-finalization.json >/dev/null
  - >
    python3 - <<'PY'
    import json, sys
    with open('agent-control/results/task-001-control-plane-repair.json') as f:
        data = json.load(f)
    if data.get('completed_at') != '2026-07-30T14:24:53Z':
        print(f"ERROR: Protocol 10 result completed_at is '{data.get('completed_at')}', expected '2026-07-30T14:24:53Z'", file=sys.stderr)
        sys.exit(1)
    print("✓ Protocol 10 result completed_at preserved")
    PY
  - python3 scripts/check_control_state.py
  - bash scripts/test_control_state.sh
  - git diff --check
  - git diff --exit-code 2c82f6533f2b74175dfa6dc8543919ceb051ab71...HEAD -- docs sources templates AGENTS.md agent-control/TASK_PROTOCOL.md agent-control/VALIDATION_RECORD.txt agent-control/results/task-001-pr.md scripts/validate_source_records.py scripts/test_validation_negative.sh
  - >
    python3 - <<'PY'
    import subprocess, sys
    allowed = {
        'scripts/check_control_state.py',
        'scripts/test_control_state.sh',
        'agent-control/results/task-001-control-plane-repair.json',
        'agent-control/results/task-001-control-plane-finalization.json',
        'state/CURRENT_STATE.yaml',
        'agent-control/results/task-001.json',
    }
    changed = set(subprocess.check_output(
        ['git', 'diff', '--name-only', '2c82f6533f2b74175dfa6dc8543919ceb051ab71...HEAD'],
        text=True,
    ).splitlines())
    unexpected = sorted(changed - allowed)
    if unexpected:
        print('Unexpected paths changed after Protocol 11 baseline:')
        print('\n'.join(unexpected))
        sys.exit(1)
    PY
  - grep -q '^status: awaiting_owner_decision$' agent-control/CURRENT_TASK.yaml
  - grep -q 'owner_acceptance: pending' agent-control/CURRENT_TASK.yaml
  - grep -q 'formal_closure: false' agent-control/CURRENT_TASK.yaml
  - grep -q 'task_002_status: not_started' agent-control/CURRENT_TASK.yaml
  - test "$(git rev-parse --abbrev-ref HEAD)" = "agent/task-001-core-research"

post_restoration_acceptance_commands:
  - grep -q '^status: awaiting_owner_decision$' agent-control/CURRENT_TASK.yaml
  - grep -q '^allowed_paths: \[\]$' agent-control/CURRENT_TASK.yaml
  - grep -q 'owner_acceptance: pending' agent-control/CURRENT_TASK.yaml
  - grep -q 'formal_closure: false' agent-control/CURRENT_TASK.yaml
  - grep -q 'task_002_status: not_started' agent-control/CURRENT_TASK.yaml
  - grep -q 'repair_completed_at: ["\x27]2026-07-30T14:24:53Z["\x27]' agent-control/CURRENT_TASK.yaml
  - >
    python3 - <<'PY'
    import sys, re
    with open('agent-control/CURRENT_TASK.yaml') as f:
        content = f.read()
    if 'control_plane_repair' not in content:
        print("ERROR: Final main:CURRENT_TASK.yaml must record control_plane_repair section", file=sys.stderr)
        sys.exit(1)
    if not re.search(r'repair_completed_at:\s*["\']?2026-07-30T14:24:53Z["\']?', content):
        print("ERROR: Final main:CURRENT_TASK.yaml must record Protocol 10 repair_completed_at: 2026-07-30T14:24:53Z", file=sys.stderr)
        sys.exit(1)
    if 'control_plane_finalization' not in content:
        print("ERROR: Final main:CURRENT_TASK.yaml must record control_plane_finalization section", file=sys.stderr)
        sys.exit(1)
    if not re.search(r'finalization_completed_at:\s*["\']?2026-07-\d{2}T\d{2}:\d{2}:\d{2}Z["\']?', content):
        print("ERROR: Final main:CURRENT_TASK.yaml must record Protocol 11 finalization_completed_at timestamp", file=sys.stderr)
        sys.exit(1)
    if not re.search(r'finalization_result_file:\s*agent-control/results/task-001-control-plane-finalization\.json', content):
        print("ERROR: Final main:CURRENT_TASK.yaml must record Protocol 11 finalization_result_file", file=sys.stderr)
        sys.exit(1)
    print("✓ Final main:CURRENT_TASK.yaml records both Protocol 10 and 11 completion timestamps and result file")
    PY
  - test "$(git rev-parse --abbrev-ref HEAD)" = "main"
  - git diff --check

