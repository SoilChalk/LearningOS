objective: >
  Implement the minimal interactive session runner for the FIRST_VERTICAL_SCENARIO
  6-step flow, sufficient to conduct ONE real-material learning session with a
  human learner. This is the thin vertical seam that makes the first real pilot
  runnable — NOT a helper-module build-out, NOT a product, NOT a learner model.

  Required behavior:
  1. Accept real course material via a thin seam (path to a text/sectioned
     document provided at runtime; no indexing service, no vector DB, no
     parser framework).
  2. Step 1 Position Recovery: for a returning session load the saved
     minimal_learning_state via scripts/learning_state.load_state and present
     the saved position; for a new session accept a natural-language goal.
  3. Step 2 Task Boundary: record task_boundary (material section range, task
     type, observable completion criterion) and confirm with the user.
  4. Step 3 Confusion Expression: accept ANY natural-language confusion
     statement (including "I don't know where I'm confused") without rejection.
  5. Step 4 Bounded Pedagogical Action: select ONE action using the six
     documented decision-tree rules from docs/PEDAGOGICAL_ACTION_DECISION_TREE.md
     (Clarify Terminology / Restore Prerequisite / Give Bounded Example /
     Request Explanation / Request Fresh Attempt / Stop and Request More
     Material) and cite the relevant material section. Thin rule implementation
     only — no automatic obstacle-type detection before the user speaks, no
     learner model, no mastery classifier.
  6. Step 5 Independent Check: request an observable demonstration and record
     evidence_level 0|1|2 in the state.
  7. Step 6 State Persistence: save the minimal state via
     scripts/learning_state.save_state (atomic write, same-dir temp + os.replace
     — reuse the existing module unchanged), generate a next-action
     recommendation per FIRST_VERTICAL_SCENARIO Step 6 (evidence level 2 -> next
     problem/concept; 1 -> review prerequisite then retry; 0 -> continue with
     suggested action), and display a "Saved your progress" confirmation.
  8. Distinguish factual observations from inferences in all recorded evidence
     (no inference that the user understands a section from position
     confirmation alone).

  Reuse, do NOT rebuild: templates/MINIMAL_LEARNING_STATE.schema.json (unchanged),
  scripts/learning_state.py (unchanged API), docs/FIRST_VERTICAL_SCENARIO.md and
  docs/PEDAGOGICAL_ACTION_DECISION_TREE.md (authoritative behavior references).

  Explicitly NOT in scope (must NOT be built): generic indexing service, vector
  DB, learner model, automatic mastery classifier, scheduler, frontend,
  multi-course support, generic orchestration, persistence framework, chat
  history summarization.

