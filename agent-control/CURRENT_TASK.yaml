acceptance_commands:
  - python3 -m json.tool sources/source-ledger.json >/dev/null
  - python3 -m json.tool templates/SOURCE_RECORD.json >/dev/null
  - python3 -m json.tool templates/SOURCE_LEDGER.schema.json >/dev/null
  - python3 scripts/validate_source_records.py
  - bash scripts/test_validation_negative.sh
  - find . -maxdepth 3 -type f | sort
  - git diff --check origin/main...HEAD
  - grep -q 'src-006' docs/REFERENCE_SYSTEM_MATRIX.md
  - grep -q 'src-007' docs/REFERENCE_SYSTEM_MATRIX.md
  - grep -q 'src-008' docs/REFERENCE_SYSTEM_MATRIX.md
  - "! grep -R -nE 'Sources: 5 verified sources|five verified sources|5/8|stopped below minimum|required_research_dimension_has_no_accessible_primary_or_high_quality_survey_after_three_distinct_candidates|pedagogical action requires explicit control|\\+4-9 percentile points|4-9 percentile points|tracks millions of knowledge states|source-grounding \\+ learner-model integration|source_grounding_plus_learner_model_integration' docs sources state agent-control/results"

post_push_verification:
  - git rev-parse HEAD
  - git ls-remote origin refs/heads/agent/task-001-core-research
  - >
    gh pr view 2 --json isDraft,body,headRefOid --jq
    '{isDraft,headRefOid,body}'
  - >
    Confirm the live PR body reports the final remote head, eight verified sources,
    truthful Stage 3 and Gate 1 states, and contains no rejected stop narrative.

review_08_acceptance:
  - Live PR body matches the final remote branch state and SHA.
  - Matrix is rebuilt from all eight verified sources.
  - Design gates and research questions match the eight-source evidence.
  - Every RQ has a direct, partial, or uncovered classification with source IDs.
  - Source grounding, learner-model transparency, outcome prediction, and knowledge-state estimation are not conflated.
  - Gate 1 exit conditions are evaluated explicitly rather than inferred from source count.
  - Validation evidence uses truthful non-self-referential bookkeeping.
  - All status-bearing artifacts agree.
  - PR remains Draft; Task 002 remains not started.

stop_conditions:
  - same_required_operation_fails_twice_after_declared_fallback_and_no_equivalent_alternative_exists
  - repository_state_cannot_be_persisted_after_two_attempts
  - task_requires_modifying_a_forbidden_path
  - requested_content_is_not_suitable_for_a_public_repository

completion_process:
  - Fetch and merge origin/main into the existing task branch without discarding task work.
  - Read PR Review 08 and execute only this protocol-8 contract.
  - Run every acceptance command verbatim and record exact exit codes.
  - Commit and push the existing branch.
  - Verify local HEAD equals the remote branch SHA.
  - Update the actual GitHub PR body after the final push.
  - Run post_push_verification and report its output.
  - Stop without merging PR #2 or starting Task 002.
