objective: >
  Bounded repository hygiene baseline so LearningOS has a clear, credible
  software-engineering trajectory suitable for a public personal project.
  Deliverables (no history rewrite, no governance system, no new controller):
  1. Rewrite README.md as a public-facing, human-readable project README
     (problem, product position = personal learning execution / friction-
     reduction layer, real capabilities, VS Code interaction surface,
     architecture/components, quick start, tests, maturity/limitations,
     development status, privacy boundary). Internal Agent authority chain
     may be linked but must be reduced to a Development/Internal section.
  2. Add docs/PROJECT_HISTORY.md — honest retrospective reconstructed from
     existing repository records (real Issue/PR/commit links; explicitly
     labeled as reconstructed; no fabricated processes/dates/releases).
  3. Add docs/DEVELOPMENT.md — very short default workflow (product issue →
     task contract where needed → feature/fix branch → implementation →
     deterministic CI → reviewer → correction → READY → merge); lightweight
     semantic commit prefixes (feat:/fix:/test:/docs:/refactor:/chore:);
     no commitlint. Existing agent/task-* branch naming stays if relied on.
  4. Add .github/PULL_REQUEST_TEMPLATE.md — concise (Why, What changed,
     Scope/non-goals, Validation, Evidence, Risks/limitations, Related issue).
  5. Add deterministic GitHub Actions CI (.github/workflows/ci.yml) that runs
     the current authoritative, stable Python/shell acceptance tests. No LLM
     in CI, no gh-aw orchestration copy. Add minimal reproducible dependency
     declaration (requirements.txt) with only dependencies actually used.
  6. Make scripts/check_control_state.py and scripts/test_control_state.sh
     task-generic (derive the task-specific lifecycle status field from
     task_id instead of hardcoding task_002_status) and state-agnostic
     negative mutations so the authoritative control-state test is green.
  No LICENSE selection (owner decides separately). No retroactive releases.

