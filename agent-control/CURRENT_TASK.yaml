protocol_version: 5

task_id: task-001-core-research
status: in_progress
branch: agent/task-001-core-research
pull_request: 2

objective: >
  Continue Task 001 Stage 2 research from the current five verified sources.
  Add only directly read, concrete, high-quality sources until the minimum of
  eight verified sources is reached, or document a protocol stop condition.

context:
  authoritative_issue: https://github.com/SoilChalk/LearningOS/issues/1
  review_target: https://github.com/SoilChalk/LearningOS/pull/2
  prior_review: task-001-review-05
  prior_review_decision: accepted
  accepted_head: bafc178370c9bba50769310625e6220299c06e1f
  note: >
    Review 05 corrections are accepted. The matrix is current for five verified
    sources but Stage 3 and Gate 1 remain incomplete. This file replaces the
    obsolete Review 02 correction contract.

allowed_paths:
  - AGENTS.md
  - agent-control/**
  - docs/**
  - sources/**
  - templates/**
  - state/**
  - scripts/**

forbidden_paths:
  - private/**
  - personal/**
  - raw-course-materials/**
  - .env
  - "**/*.key"
  - "**/*secret*"
  - "**/*token*"

current_truth:
  task_status: in_progress
  gate_1_status: not_met
  verified_source_count: 5
  minimum_source_count: 8
  verified_source_ids:
    - src-001
    - src-002
    - src-003
    - src-004
    - src-005
  stage_2_status: in_progress
  stage_3_artifact_status: current_for_5_verified_sources
  stage_3_status: incomplete_until_minimum_8_sources
  task_002_status: not_started

execution_cycle:
  cycle_id: task-001-stage-2-resume-01
  decision: continue_research
  scope:
    - >
      Read the current ledger, source notes, research questions, matrix, design
      gates, state file, and Task 001 result before searching.
    - >
      Prioritize uncovered RQ5.2 and weak evidence dimensions: learner-state
      change from interaction evidence, source-grounding plus learner-model
      integration, and evidence-based pedagogical action selection.
    - >
      Attempt no more than three distinct accessible candidates per required
      dimension. Stop early after three additional sources are fully verified.
    - >
      Count a source only after reading its source body and recording one
      concrete primary or high-quality survey URL, publication metadata,
      access date, directly supported observations, design implications,
      limitations/non-inferences, and affected decisions.
    - >
      Product pages may support feature claims but not learning-effect claims.
      Search snippets, aggregate URLs, remembered literature, and inaccessible
      papers do not count as verified evidence.
    - >
      Update the ledger, one source note per accepted source, the provisional
      matrix, research coverage, design gates, current state, Task 001 result,
      and actual PR body. Do not create implementation architecture or code
      beyond validation/support scripts already in scope.
    - >
      Do not mark Gate 1 met merely because the source count reaches eight.
      Evaluate every Gate 1 exit condition explicitly and keep unsupported
      conclusions scoped to the reviewed sample.

required_outputs:
  - docs/RESEARCH_QUESTIONS.md
  - docs/REFERENCE_SYSTEM_MATRIX.md
  - docs/DESIGN_GATES.md
  - sources/source-ledger.json
  - sources/src-*.md
  - templates/SOURCE_RECORD.json
  - templates/SOURCE_LEDGER.schema.json
  - scripts/validate_source_records.py
  - scripts/test_validation_negative.sh
  - state/CURRENT_STATE.yaml
  - agent-control/results/task-001.json

source_requirements:
  minimum_count: 8
  maximum_count: 15
  target_additional_verified_sources: 3
  rules:
    - Product pages support feature claims, not learning-effect claims.
    - Search snippets cannot substitute for reading the source body.
    - Placeholder or aggregate URLs are invalid source URLs.
    - Dates, metrics, and current product claims require an access date.
    - Individual reports must not be generalized into population claims.
    - Prefer eight strong sources over weak sources added to satisfy the count.
    - Each accepted source must pass the production JSON Schema validator.

acceptance_commands:
  - python3 -m json.tool sources/source-ledger.json >/dev/null
  - python3 -m json.tool templates/SOURCE_RECORD.json >/dev/null
  - python3 -m json.tool templates/SOURCE_LEDGER.schema.json >/dev/null
  - python3 scripts/validate_source_records.py
  - bash scripts/test_validation_negative.sh
  - find . -maxdepth 3 -type f | sort
  - git diff --check origin/main...HEAD
  - "! grep -R -nE 'Sources: 8 verified|\\+14 percentile points|14 percentile point gain' docs sources state agent-control/results"

completion_states:
  reached_minimum:
    - Ledger contains at least eight fully verified concrete sources.
    - Matrix and research coverage are rebuilt from the full verified ledger.
    - All status-bearing artifacts agree on source count and gate status.
  stopped_below_minimum:
    - Each remaining required dimension has three documented distinct candidate attempts.
    - Inaccessible or rejected candidates are not counted as evidence.
    - Result and PR body state the exact stop condition and unresolved gap.

stop_conditions:
  - same_required_operation_fails_twice_after_declared_fallback_and_no_equivalent_alternative_exists
  - required_research_dimension_has_no_accessible_primary_or_high_quality_survey_after_three_distinct_candidates
  - repository_state_cannot_be_persisted_after_two_attempts
  - task_requires_modifying_a_forbidden_path
  - requested_content_is_not_suitable_for_a_public_repository

completion_process:
  - Fetch and merge origin/main into the existing task branch without discarding task work.
  - Execute only this Stage 2 research cycle.
  - Run every acceptance command verbatim and record exact exit codes.
  - Commit and push the existing branch so Draft PR #2 updates.
  - Verify local HEAD equals the remote branch SHA after push.
  - Update the actual PR body with truthful source count, gate state, and outcome.
  - Stop without merging or starting Task 002.
