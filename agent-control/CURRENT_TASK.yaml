completion_conditions:
  - Tests operate exclusively on isolated fixtures and live authority hashes remain unchanged.
  - Protocol 11 result truthfully records completed main restoration.
  - Enhanced AGENTS, TASK_PROTOCOL, state, results, checker, and tests exist on main.
  - Main ends in awaiting_owner_decision with allowed_paths empty.
  - Protocol 12 result is candidate_complete pending independent review, not owner-accepted.
  - The task branch contains current main as an ancestor and has no merge conflict with main.
  - PR #2 remains Draft/open/unmerged; Task 001 remains open; Task 002 remains not started.

stop_conditions:
