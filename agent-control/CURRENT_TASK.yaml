review_13_findings:
  blocking_issues:
    - >
      check_control_state.py was not run; result marked it N/A while claiming
      all acceptance commands passed
    - >
      CURRENT_TASK (ready/not_started) disagrees with CURRENT_STATE and
      task-002.json (candidate_complete); checker requires agreement
    - >
      validate_task_002.py checks only phrase presence, not actual per-step
      entry/exit criteria
    - >
      Classification model inconsistent: docs/result claim 6 types, schema
      allows 8, outside-corpus and cannot-articulate routing contradictory,
      pseudocode missing cannot_articulate handling
    - >
      Schema does not enforce source grounding: material_citations permits
      zero items, nested objects permit arbitrary fields, check_type
      nullable-enum conflict
    - >
      CURRENT_STATE prematurely sets Gate 3 entry_conditions_met=true while
      reviewer_acceptance=pending
    - >
      task-002.json has stale next_action, DESIGN_GATES.md has stale Gate 1/2
      summary, completion timestamp lacks auditable source

allowed_paths:
  - agent-control/CURRENT_TASK.yaml
  - agent-control/results/task-002.json
  - docs/DESIGN_GATES.md
  - docs/FIRST_VERTICAL_SCENARIO.md
  - docs/PEDAGOGICAL_ACTION_DECISION_TREE.md
  - templates/MINIMAL_LEARNING_STATE.schema.json
  - scripts/validate_task_002.py
  - scripts/test_task_002_negative.sh
  - state/CURRENT_STATE.yaml

forbidden_paths:
  - sources/**
  - docs/RESEARCH_QUESTIONS.md
  - docs/REFERENCE_SYSTEM_MATRIX.md
  - agent-control/results/task-001*.json
  - agent-control/VALIDATION_RECORD.txt
  - agent-control/TASK_PROTOCOL.md
  - AGENTS.md
  - scripts/check_control_state.py
  - scripts/test_control_state.sh

repair_phases:
  phase_0_preflight:
    - verify working tree clean
    - verify PR #3 Draft, open, unmerged, mergeable
    - verify task branch HEAD d9cc4463254eda7508550d979ba913f53e6e1abe
    - verify Task 001 formally closed
    - verify Gate 3 not started
  
  phase_1_publish_contract:
    - publish Protocol 16 on main with protocol_version 16
    - synchronize task branch with Protocol 16 contract

  phase_2_control_state:
    - align CURRENT_TASK.yaml, CURRENT_STATE.yaml, task-002.json
    - all three must agree on task_id, status, lifecycle fields
    - final state: status=candidate_complete
    - Gate 3: status=not_started, entry_conditions_met=false,
      blocked_by=gate_2_independent_review
    - run python3 scripts/check_control_state.py with actual exit code

  phase_3_per_step_validation:
    - fix validate_task_002.py to validate each Step 1-6 independently
    - verify Entry/Exit Criteria, Recovery Behavior, Evidence Collection
      within each step's text range
    - add negative tests for missing criteria per step
    - verify tests use isolated fixtures, leave live files unchanged

  phase_4_classification_model:
    - use exactly 6 core classifications: terminology_gap,
      prerequisite_deficit, procedural_confusion, conceptual_confusion,
      stuck_on_specific_step, lost_context
    - separate material_scope_status (in_scope, missing_required_material,
      outside_supplied_corpus) from obstacle classification
    - separate articulation_status (articulated, cannot_articulate) from
      obstacle classification
    - outside_supplied_corpus or missing_required_material →
      stop_and_request_more_material
    - cannot_articulate → bounded diagnostic prompt or source-grounded example
    - cannot_articulate must not fall through silently
    - all routing must be explicit
    - pseudocode, prose, schema, validator, result must use same definitions

  phase_5_schema_repair:
    - evidence levels: [0, 1, 2] only (level 2 = one instance, not mastery)
    - add additionalProperties: false to all bounded nested objects
    - correct nullable-enum conflicts
    - enforce citation rules: source-grounded actions require ≥1 citation
      (stop_and_request_more_material may use empty list with failure reason)
    - no mastery estimates, knowledge graphs, cross-course profiles,
      review schedules, generalized learner-model state
    - validator must reject: source-grounded action with zero citations,
      arbitrary nested fields, nullable-enum conflicts,
      cannot_articulate as core classification, undefined routes

  phase_6_stale_claims:
    - correct task-002.json next_action (branch pushed, PR #3 exists)
    - correct DESIGN_GATES.md stale summaries
    - correct any claim that Gate 3 entry conditions met
    - correct any claim all acceptance commands passed before they pass
    - derive completion timestamp from final repair commit Git metadata
    - record timestamp source explicitly

  phase_7_validation:
    - run all acceptance commands with actual exit codes
    - record every command and exit code
    - do not mark all_acceptance_commands_passed unless all actually passed

  phase_8_commit_push_stop:
    - commit repair with clear message
    - push task branch
    - update PR #3 body with Protocol 16 status
    - keep PR #3 Draft, open, unmerged
    - stop without merge, Ready transition, Gate 3 start, API calls

acceptance_commands:
  - python3 -m json.tool templates/MINIMAL_LEARNING_STATE.schema.json >/dev/null
  - python3 -m json.tool agent-control/results/task-002.json >/dev/null
  - python3 scripts/validate_task_002.py
  - bash scripts/test_task_002_negative.sh
  - python3 scripts/check_control_state.py
  - git diff --check
  - grep -q '^# First Vertical Scenario' docs/FIRST_VERTICAL_SCENARIO.md
  - grep -q '^# Pedagogical Action Decision Tree' docs/PEDAGOGICAL_ACTION_DECISION_TREE.md
  - >
    python3 - <<'PY'
    import subprocess, sys
    allowed = {
        'agent-control/CURRENT_TASK.yaml',
        'docs/FIRST_VERTICAL_SCENARIO.md',
        'docs/PEDAGOGICAL_ACTION_DECISION_TREE.md',
        'docs/DESIGN_GATES.md',
        'templates/MINIMAL_LEARNING_STATE.schema.json',
        'scripts/validate_task_002.py',
        'scripts/test_task_002_negative.sh',
        'state/CURRENT_STATE.yaml',
        'agent-control/results/task-002.json',
    }
    changed = set(subprocess.check_output(
        ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
    ).splitlines())
    bad = sorted(changed - allowed)
    if bad:
        print('\n'.join(bad))
        sys.exit(1)
    PY

completion_conditions:
  - All Review 13 blocking issues corrected
  - Control state consistent across CURRENT_TASK, CURRENT_STATE, result
  - Per-step validation verifies criteria within each step's text
  - Classification model consistent and explicit across all files
  - Schema enforces source grounding and prohibits speculative fields
  - Gate 3 correctly marked not_started with entry_conditions_met=false
  - All stale claims corrected
  - All acceptance commands pass with actual exit codes
  - PR #3 remains Draft, open, unmerged

stop_conditions:
  - Working tree not clean at preflight
  - PR #3 not Draft/open/unmerged/mergeable
  - Task branch HEAD not d9cc446
  - Task 001 not formally closed
  - Gate 3 already started
  - Any repair would require modifying forbidden paths
  - Validation fails and cannot be corrected within allowed paths

completion_process:
  - Execute all repair phases in order
  - Record all validation exit codes
  - Commit and push repair
  - Update PR #3 body
  - Keep PR #3 Draft, open, unmerged
  - Stop without merge, Ready transition, or Gate 3 start
