required_changes:
  - >
    Merge the latest origin/main into the existing task branch before editing.
    Resolve conflicts without discarding source notes or prior accepted validator
    work. Do not merge PR #2.
  - >
    Update the actual GitHub PR body only after final validation. The current live
    body still reports five sources and the rejected stop condition. Editing
    agent-control/results/task-001-pr.md is not a substitute for gh pr edit or the
    GitHub API.
  - >
    Rebuild docs/REFERENCE_SYSTEM_MATRIX.md from scratch as an eight-source artifact.
    Remove the stale five-source header, source table, Layer 5 analysis, gap claims,
    deferred list, next steps, and final status. Include src-006, src-007, and
    src-008 only within their actual evidence boundaries.
  - >
    Update docs/DESIGN_GATES.md to the eight-source state. Correct Tutor CoPilot
    effects to percentage points, not percentile points. Remove the claim that Study
    Mode requires explicit pedagogical control. Evaluate every Gate 1 exit condition
    explicitly with evidence, pass/fail status, and unresolved work.
  - >
    Update docs/RESEARCH_QUESTIONS.md with a source coverage section. Classify every
    RQ individually as directly_covered, partially_covered, or not_covered. Include
    source IDs and one evidence-boundary note for each RQ. Do not claim all ten RQs
    are addressed when RQ1.2 or other questions lack direct evidence.
  - >
    Correct src-006 in both its note and ledger record. The KT survey supports
    interaction-sequence modeling, side information, model variants, and adaptive
    learning applications. It does not establish user-material source grounding.
    Remove source_grounding_strategy as an affected decision. Remove the imported
    claim that deep learning tracks millions of knowledge states with tractable
    adaptive assessment. Treat evidence for RQ5.2 as partial and limited to
    structured exercise interactions, not open reading or debugging.
  - >
    Correct src-007 in both its note and ledger record. Open learner model
    transparency means exposing or negotiating a learner model; it is not source
    grounding to user-provided course materials. Remove source-grounding +
    learner-model integration claims and related decision identifiers. Retain
    evidence about learner-model transparency, agency, SRL scaffolding, feedback,
    and adaptive personalization. Mark cross-task RQ5.2 relevance as partial.
  - >
    Correct src-008 in both its note and ledger record. The paper predicts course
    outcomes or risk from LMS behavioral traces; it does not estimate conceptual
    mastery or a KT-style knowledge state. Use outcome/risk prediction terminology.
    Map it strongly to RQ4.1 and, with limitations, RQ4.2. Do not treat it as direct
    evidence resolving the unified learner-model question in RQ5.2.
  - >
    Rebuild agent-control/results/task-001.json from the corrected artifacts. Do not
    use unresolved_issues: [] or blockers: [] while Stage 3, Gate evaluation,
    obstacle-specific adaptation, material scope control, or cross-task model
    applicability remain partial or unresolved. Coverage labels must match the
    research-question artifact.
  - >
    Replace false self-referential validation bookkeeping. A tracked validation file
    may record validated_commit, meaning the commit whose tree was validated before
    a later bookkeeping commit. It must not claim that an older SHA is the current
    final remote head. Record final local/remote equality externally in the live PR
    body after the final push.
  - >
    Reconcile sources/source-ledger.json, all source notes, the matrix, research
    questions, design gates, state/CURRENT_STATE.yaml, task-001.json,
    task-001-pr.md, the validation record, and the live PR body. They must agree on
    eight verified records, Task 001 in progress, the actual Stage 3 state, Gate 1
    status, incomplete candidate count, and next action.

