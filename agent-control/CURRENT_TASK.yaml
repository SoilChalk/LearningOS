required_changes:
  - >
    Remove or explicitly supersede the stop_below_minimum outcome in the ledger,
    Task 001 result, current state, design gates, and actual PR body. Restore a
    coherent active Stage 2 status. Do not describe external resolution as required.
  - >
    Correct the Study Mode regression in sources/source-ledger.json. The source
    documents user-requested controls and possible direct answers; it does not prove
    that explicit instruction is technically required, that Socratic behavior is
    opt-in/default-off, or that automatic adjustment never occurs. Keep those as
    project design inferences only.
  - >
    Directly read and evaluate the accessible full body of A Survey of Knowledge
    Tracing: Models, Variants, and Applications (arXiv 2105.15106). Use official
    arXiv HTML/PDF/e-print retrieval and local PDF-to-text extraction if browser
    rendering fails. Distinguish the arXiv version date from later journal metadata.
  - >
    Directly read and evaluate the accessible full Frontiers article Open learner
    models and pedagogical strategies in higher education: a meta-synthesis of
    approaches to self-regulated learning, DOI 10.3389/feduc.2025.1760183. Record
    its actual publication date, 2026-01-26, separately from the DOI year.
  - >
    Directly read and evaluate at least one additional accessible body relevant to
    interaction evidence: the MDPI systematic review DOI 10.3390/su15107849 or the
    PMC article PMC10556130. Use official HTML, XML, PDF, NCBI/Europe PMC, or local
    download fallbacks rather than treating one CAPTCHA or bot challenge as source
    unavailability.
  - >
    Do not automatically count the three named candidates. Add a source only after
    its body is read and a complete schema-valid record and source note are written.
    Map each accepted or rejected candidate explicitly to the priority dimensions.
  - >
    Track candidate attempts per required dimension. A stop condition may be invoked
    only after three distinct acceptable retrieval candidates fail for the same
    required dimension after documented fallback attempts.
  - >
    Reconcile all counts and state fields. The current result reports ten incomplete
    candidates while one Gate 1 blocker still reports six; next_action, blocked,
    stop_condition_reached, stage status, and PR body must tell one consistent story.
  - >
    Rebuild the provisional matrix and research coverage from the resulting verified
    ledger. Re-evaluate every Gate 1 exit condition explicitly; reaching eight sources
    alone does not make Gate 1 complete.

retrieval_fallback_order:
  - official HTML full text
  - official XML or structured article endpoint
  - official PDF downloaded with curl -L or equivalent and converted locally to text
  - official repository mirror such as NCBI or Europe PMC
  - DOI-linked author or institutional manuscript
  - reject only after the relevant dimension has three documented candidate failures

required_outputs:
  - docs/RESEARCH_QUESTIONS.md
  - docs/REFERENCE_SYSTEM_MATRIX.md
  - docs/DESIGN_GATES.md
  - sources/source-ledger.json
  - sources/src-*.md
  - templates/SOURCE_RECORD.json
  - templates/SOURCE_LEDGER.schema.json
  - scripts/validate_source_records.py
  - scripts/test_validation_negative.sh
  - state/CURRENT_STATE.yaml
  - agent-control/results/task-001.json

source_requirements:
  minimum_count: 8
  maximum_count: 15
  target_additional_verified_sources: 3
  rules:
    - Product pages support feature claims, not learning-effect claims.
    - Search snippets cannot substitute for reading the source body.
    - Placeholder or aggregate URLs are invalid source URLs.
    - Dates, metrics, and current product claims require an access date.
    - Individual reports must not be generalized into population claims.
    - Prefer eight strong sources over weak sources added to satisfy the count.
    - Each accepted source must pass the production JSON Schema validator.
    - A retrieval-tool failure is not evidence that the public source is inaccessible.

whitespace_remediation:
  trigger: >
    git diff --check origin/main...HEAD fails only because trailing whitespace
    already exists in commits on the task branch that predate the current Review 07
    working-tree changes.
  required_procedure:
    - Preserve all current tracked and untracked Review 07 work with git stash push -u.
    - Identify only the paths reported by git diff --check origin/main...HEAD.
    - Remove trailing spaces and tabs from those paths without changing substantive content.
    - Verify the cleanup is whitespace-only using git diff --ignore-space-at-eol --exit-code.
    - Verify git diff --check passes for the cleanup working tree.
    - Create one dedicated whitespace-only repair commit.
    - Re-run git diff --check origin/main...HEAD; it must now exit zero.
    - Restore the Review 07 work from the stash and resolve any conflict without discarding work.
    - Before the Review 07 commit, run git diff --check and git diff --cached --check on the working tree/index.
    - After the Review 07 commit, run every original acceptance command verbatim again.
  restrictions:
    - This procedure is not an acceptance waiver.
    - Do not alter prose, evidence claims, schemas, or behavior in the whitespace-only commit.
    - Do not commit Review 07 substantive changes until working-tree whitespace checks pass.

acceptance_commands:
  - python3 -m json.tool sources/source-ledger.json >/dev/null
  - python3 -m json.tool templates/SOURCE_RECORD.json >/dev/null
  - python3 -m json.tool templates/SOURCE_LEDGER.schema.json >/dev/null
  - python3 scripts/validate_source_records.py
  - bash scripts/test_validation_negative.sh
  - find . -maxdepth 3 -type f | sort
  - git diff --check origin/main...HEAD
  - "! grep -R -nE 'Sources: 8 verified|\\+14 percentile points|14 percentile point gain|Pedagogical action selection requires explicit user instruction|Socratic questioning is opt-in feature, not default behavior' docs sources state agent-control/results"

review_07_acceptance:
  - Invalid Stage 2 stop condition is removed or explicitly superseded.
  - Stage 2 is active and all state-bearing artifacts are internally consistent.
  - Accessible full source bodies are directly read and evaluated.
  - Candidate attempts and outcomes are mapped per required dimension.
  - Study Mode direct observations and design inferences remain separated everywhere.
  - Ledger, matrix, gates, state, result, and PR body agree on counts and gate status.
  - Local HEAD equals the remote branch SHA after push.
  - PR remains Draft and Task 002 is not started.

stop_conditions:
  - same_required_operation_fails_twice_after_declared_fallback_and_no_equivalent_alternative_exists
  - required_research_dimension_has_no_accessible_primary_or_high_quality_survey_after_three_distinct_candidates
  - repository_state_cannot_be_persisted_after_two_attempts
  - task_requires_modifying_a_forbidden_path
  - requested_content_is_not_suitable_for_a_public_repository

completion_process:
  - Fetch and merge origin/main into the existing task branch without discarding task work.
  - Read PR Review 07 and execute only required_changes in this contract.
  - Apply whitespace_remediation only if its trigger is satisfied.
  - Run every acceptance command verbatim and record exact exit codes.
  - Commit and push the existing branch so Draft PR #2 updates.
  - Verify local HEAD equals the remote branch SHA after push.
  - Update the actual PR body with truthful source count, gate state, and outcome.
  - Stop without merging or starting Task 002.