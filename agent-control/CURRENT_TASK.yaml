acceptance_commands:
  - python3 -m json.tool templates/MINIMAL_LEARNING_STATE.schema.json >/dev/null
  - python3 -m json.tool agent-control/results/task-002.json >/dev/null
  - python3 scripts/validate_task_002.py
  - bash scripts/test_task_002_negative.sh
  - python3 scripts/check_control_state.py
  - git diff --check
  - grep -q '^# First Vertical Scenario' docs/FIRST_VERTICAL_SCENARIO.md
  - grep -q '^# Pedagogical Action Decision Tree' docs/PEDAGOGICAL_ACTION_DECISION_TREE.md
  - >
    python3 - <<'PY'
    import subprocess, sys
    allowed = {
        'agent-control/CURRENT_TASK.yaml',
        'docs/DESIGN_GATES.md',
        'scripts/test_task_002_negative.sh',
        'state/CURRENT_STATE.yaml',
        'agent-control/results/task-002.json',
    }
    baseline = 'f97acff5eb8fec7d5aea6635d2d560eb825a728b'
    changed = set(subprocess.check_output(
        ['git', 'diff', '--name-only', f'{baseline}...HEAD'], text=True
    ).splitlines())
    bad = sorted(changed - allowed)
    if bad:
        print('\n'.join(bad))
        sys.exit(1)
    PY
  - >
    python3 - <<'PY'
    import json
    from pathlib import Path

    forbidden = [
        "Protocol 19 validation closure " + "in progress",
        "2026-08-05T11:" + "00:00+08:00",
    ]

    current_task = Path(
        "agent-control/CURRENT_TASK.yaml"
    ).read_text()

    result = json.loads(
        Path("agent-control/results/task-002.json").read_text()
    )
    result.pop("validation", None)

    texts = {
        "CURRENT_TASK": current_task,
        "CURRENT_STATE": Path(
            "state/CURRENT_STATE.yaml"
        ).read_text(),
        "DESIGN_GATES": Path(
            "docs/DESIGN_GATES.md"
        ).read_text(),
        "task-002.json semantic content": json.dumps(
            result,
            ensure_ascii=False,
            sort_keys=True,
        ),
    }

    errors = []
    for marker in forbidden:
        for name, text in texts.items():
            if marker in text:
                errors.append(f"{name}: {marker}")

    if errors:
        raise SystemExit(
            "Forbidden stale content remains:\n"
            + "\n".join(errors)
        )

    print("Semantic stale-content check passed")
    PY
  - >
    ! grep -q \
      '20 tests (1 positive + 19 negative)' \
      docs/DESIGN_GATES.md
  - >
    ! grep -q \
      'Audit Reconciliation (in_progress)' \
      docs/DESIGN_GATES.md
  - >
