completion_conditions:
  - All acceptance commands exit 0.
  - README is public-facing (not an internal agent control manual).
  - docs/PROJECT_HISTORY.md uses only real repository records with links.
  - docs/DEVELOPMENT.md is short and defines the default workflow.
  - .github/PULL_REQUEST_TEMPLATE.md exists and is concise.
  - CI workflow exists, is deterministic, and runs no LLM.
  - requirements.txt declares only actually-used dependencies.
  - No history rewritten, no fabricated records, no new governance runtime.

stop_conditions:
