repair_requirements:
  repair_1_separate_classification_fields:
    description: >
      Replace eight-value system_classification with separate fields:
      obstacle_classification (6 values + null), material_scope_status (3 values),
      articulation_status (2 values)
    changes:
      - observed_difficulty schema structure
      - obstacle_classification enum: [terminology_gap, prerequisite_deficit,
        procedural_confusion, conceptual_confusion, stuck_on_specific_step,
        lost_context, null]
      - material_scope_status enum: [in_scope, missing_required_material,
        outside_supplied_corpus]
      - articulation_status enum: [articulated, cannot_articulate]
      - cannot_articulate never a core obstacle classification
      - outside_corpus removed entirely
      - when cannot_articulate, obstacle may be null
      - prose, pseudocode, schema, validator, result must use identical names
  
  repair_2_conditional_citation_rules:
    description: >
      Use Draft-07 if/then to enforce minItems: 1 for source-grounded actions,
      allow empty list only for stop_and_request_more_material with stop_reason
    changes:
      - schema if/then conditional for action_type
      - validator must inspect and enforce actual conditional structure
      - clarify_terminology, restore_prerequisite, give_bounded_example,
        request_explanation, request_fresh_attempt require ≥1 citation
      - stop_and_request_more_material allows empty only with stop_reason
  
  repair_3_missing_negative_tests:
    description: Add 5+ new negative tests plus 1 positive cannot_articulate test
    new_tests:
      - source-grounded action with zero citations
      - arbitrary field in bounded nested object
      - nullable type with enum omitting null
      - cannot_articulate in core obstacle enum
      - undefined classification or missing route
      - positive: cannot_articulate + null obstacle + in_scope + diagnostic action
    total_tests: "21+ (1 positive + 20 negative)"
  
  repair_4_audit_metadata:
    description: >
      Update task-002.json to Protocol 17, derive timestamp from C1 Git metadata
    changes:
      - protocol_version: 17
      - task_id: task-002-gate-2-final-review-repair
      - baseline_commit: 3ad76b4d2c3c0b0f410eaf06c0f5bbfde031bc7b
      - completion_commit: <C1>
      - completed_at: <C1 exact Git committer timestamp>
      - timestamp_source: git_committer_metadata
      - all changed paths including CURRENT_TASK
      - actual test counts
      - actual exit codes
  
  repair_5_design_gates_status:
    description: Update DESIGN_GATES.md header/footer, no longer claim Task 001 Stage 3 active
    changes:
      - Gate 2: candidate_complete, independent_review=pending,
        exit_conditions_accepted=false, blocked_by=independent_review
      - validator description updated
      - negative test count updated
      - Protocol 17 status
      - next phase wording corrected
      - do not mark Gate 2 formally accepted

acceptance_commands:
  - python3 -m json.tool templates/MINIMAL_LEARNING_STATE.schema.json >/dev/null
  - python3 -m json.tool agent-control/results/task-002.json >/dev/null
  - python3 scripts/validate_task_002.py
  - bash scripts/test_task_002_negative.sh
  - python3 scripts/check_control_state.py
  - git diff --check
  - grep -q '^# First Vertical Scenario' docs/FIRST_VERTICAL_SCENARIO.md
  - grep -q '^# Pedagogical Action Decision Tree' docs/PEDAGOGICAL_ACTION_DECISION_TREE.md
  - >
    python3 - <<'PY'
    import subprocess, sys
    allowed = {
        'agent-control/CURRENT_TASK.yaml',
        'docs/PEDAGOGICAL_ACTION_DECISION_TREE.md',
        'docs/DESIGN_GATES.md',
        'templates/MINIMAL_LEARNING_STATE.schema.json',
        'scripts/validate_task_002.py',
        'scripts/test_task_002_negative.sh',
        'state/CURRENT_STATE.yaml',
        'agent-control/results/task-002.json',
    }
    changed = set(subprocess.check_output(
        ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
    ).splitlines())
    bad = sorted(changed - allowed)
    if bad:
        print('\n'.join(bad))
        sys.exit(1)
    PY

