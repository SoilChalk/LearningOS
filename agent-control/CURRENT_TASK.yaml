  - A validation command exits nonzero.
  - Any forbidden path changes or conflicts.
  - Execution would require force-push, history rewrite, PR merge/Ready, closure, or Task 002.
  - PR #2 is unexpectedly closed, merged, or no longer Draft.

completion_process:
  - Execute Phases 1 through 5 in order.
  - Stop at the first failed precondition or command without proceeding to later phases.
  - After all post-push checks, report every commit, modified file, command exit code, PR state, and final origin/main waiting state.
  - Stop. Do not merge PR #2, close Task 001, or start Task 002.
