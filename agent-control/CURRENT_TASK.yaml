required_changes:
  - >
    Fix `scripts/check_control_state.py` YAML parser to handle same-level indentation
    correctly. The current parser fails when multiple keys at the same indentation
    level follow a nested section. Ensure it can parse CURRENT_TASK.yaml, CURRENT_STATE.yaml,
    and task-001.json lifecycle sections correctly.
  - >
    Extend `scripts/check_control_state.py` to validate all required lifecycle fields:
    CURRENT_TASK.yaml status, previous_agent_execution, technical_completion,
    reviewer_acceptance, latest_reviewer_record, owner_acceptance, lifecycle_status,
    formal_closure, task_002_status. All three sources (task/state/result) must agree
    on these semantic values.
  - >
    Expand `scripts/test_control_state.sh` negative tests to prove the checker returns
    nonzero when: status is not awaiting_owner_decision, previous_agent_execution
    differs across sources, technical_completion differs, reviewer_acceptance differs,
    owner_acceptance differs, lifecycle_status differs, formal_closure differs,
    task_002_status differs. Add at least 8 total negative tests.
  - >
    Update `agent-control/results/task-001-control-plane-repair.json` field
    `repair_completed_at` from null to the actual Protocol 10 completion timestamp
    from the commit or result file.
  - >
    In `state/CURRENT_STATE.yaml`, update `next_action.action` to reflect
    awaiting_owner_decision state: remove "ready for Task 002 initiation" language;
    state explicitly that owner acceptance is pending and Task 002 is not started.
  - >
    In `agent-control/results/task-001.json`, update `next_action` to reflect
    awaiting_owner_decision state: remove "ready for Task 002" language; state
    explicitly that owner acceptance is pending and Task 002 is not started.
  - >
    Update GitHub PR #2 body with the actual lifecycle state and current remote HEAD
    (2c82f65 or later). Include: previous agent execution cancelled_after_commit_and_push,
    technical completion candidate_complete, reviewer accepted, owner acceptance pending,
    lifecycle awaiting_owner_decision, formal_closure false, PR Draft/open/unmerged,
    Task 002 not_started. Do not change PR Draft status, do not merge or close PR.
  - >
    After all validation passes and the task branch is pushed, switch to main branch,
    pull latest, replace `agent-control/CURRENT_TASK.yaml` with the non-executable
    awaiting_owner_decision template (task-001-core-research, no allowed paths,
    awaiting owner authorization), commit "Restore CURRENT_TASK to awaiting state after
    Protocol 11", and push main. This prevents new agents from re-executing Protocol 10/11.
  - >
    Write the declared finalization result JSON with actual commands, exit codes,
    baseline head, files changed, lifecycle state, and completion timestamp. State
    that Protocol 10+11 control-plane work is candidate complete, awaiting owner decision;
    do not claim formal task closure.

acceptance_commands:
  - python3 -m json.tool agent-control/results/task-001.json >/dev/null
  - python3 -m json.tool agent-control/results/task-001-control-plane-repair.json >/dev/null
  - python3 -m json.tool agent-control/results/task-001-control-plane-finalization.json >/dev/null
  - python3 scripts/check_control_state.py
  - bash scripts/test_control_state.sh
  - git diff --check
  - git diff --exit-code 2c82f6533f2b74175dfa6dc8543919ceb051ab71...HEAD -- docs sources templates AGENTS.md agent-control/TASK_PROTOCOL.md agent-control/VALIDATION_RECORD.txt agent-control/results/task-001-pr.md scripts/validate_source_records.py scripts/test_validation_negative.sh
  - >
    python3 - <<'PY'
    import subprocess, sys
    allowed = {
        'scripts/check_control_state.py',
        'scripts/test_control_state.sh',
        'agent-control/results/task-001-control-plane-repair.json',
        'agent-control/results/task-001-control-plane-finalization.json',
        'state/CURRENT_STATE.yaml',
        'agent-control/results/task-001.json',
    }
    changed = set(subprocess.check_output(
        ['git', 'diff', '--name-only', '2c82f6533f2b74175dfa6dc8543919ceb051ab71...HEAD'],
        text=True,
    ).splitlines())
    unexpected = sorted(changed - allowed)
    if unexpected:
        print('Unexpected paths changed after Protocol 11 baseline:')
        print('\n'.join(unexpected))
        sys.exit(1)
    PY
  - grep -q '^status: awaiting_owner_decision$' agent-control/CURRENT_TASK.yaml
  - grep -q 'owner_acceptance: pending' agent-control/CURRENT_TASK.yaml
  - grep -q 'formal_closure: false' agent-control/CURRENT_TASK.yaml
  - grep -q 'task_002_status: not_started' agent-control/CURRENT_TASK.yaml
  - test "$(git rev-parse --abbrev-ref HEAD)" = "agent/task-001-core-research"

completion_conditions:
  - YAML parser handles same-level indentation correctly.
  - Consistency checker validates all 9 required lifecycle fields across task/state/result.
  - At least 8 negative tests prove checker rejects field mismatches.
  - repair_completed_at updated to actual timestamp.
  - CURRENT_STATE and task-001 result next_action reflect awaiting_owner_decision (not "ready for Task 002").
  - PR #2 body updated with actual lifecycle state and remote HEAD; remains Draft/open/unmerged.
  - All Protocol 11 acceptance commands pass on task branch.
  - Changes committed and pushed to agent/task-001-core-research.
  - main:agent-control/CURRENT_TASK.yaml restored to non-executable awaiting state.
  - main branch pushed to prevent Protocol 10/11 re-execution.
  - Task 001 research artifacts unchanged from baseline.
  - Task 001 not formally closed, Task 002 not started, PR #2 not merged.

stop_conditions:
  - The local working tree is not clean before execution.
  - The local or remote task-branch head does not equal the declared baseline head.
  - Any required change would touch a forbidden path or alter research content.
  - The extended consistency checker or any acceptance command exits nonzero.
  - GitHub shows PR #2 merged, closed, or no longer Draft unexpectedly.
  - Execution would require interpreting Review 12 as owner acceptance.
  - Execution would require formal closure, PR merge, or Task 002 preparation.
  - Execution would mark Protocol 10 repair as formally complete.

completion_process:
  - Verify clean baseline and local/remote equality on task branch.
  - Fix YAML parser indentation handling.
  - Extend consistency checker to validate 9 lifecycle fields.
  - Expand negative tests to at least 8 tests covering field mismatches.
  - Update repair_completed_at timestamp.
  - Update CURRENT_STATE and task-001 result next_action to awaiting_owner_decision.
  - Run every acceptance command verbatim; stop before commit on any failure.
  - Write the finalization result JSON.
  - Commit and push agent/task-001-core-research.
  - Update PR #2 body with actual lifecycle state; keep Draft/open/unmerged.
  - Switch to main, pull latest, restore CURRENT_TASK.yaml to awaiting state.
  - Commit and push main to prevent re-execution.
  - Stop in awaiting_owner_decision; do not close Task 001 and do not begin Task 002.
