      Add checker options `--current-task`, `--current-state`, and `--task-result`.
      Defaults remain the live repository authority files; supplied paths must be used.
    - >
      Rewrite the negative-test script to use only temporary fixture copies and the
      checker path options. It must use `set -euo pipefail`, a cleanup trap, one
      positive fixture test, all 9 negative cases, and before/after hashes proving
      the live authority files were unchanged. It must not duplicate checker logic.
    - >
      Correct the Protocol 11 result: `status: candidate_complete`,
      `reviewer_status: changes_addressed_pending_review`; record completed main
      restoration commit `f5bf66957f9d44b665ec3969a2d18cc4a501ec9c`, completed
      post-restoration validation, and verified non-executable origin/main. Remove
      the stale statement that main restoration is pending. Owner acceptance remains
      pending and formal closure remains false.
  acceptance_commands:
    - python3 -m json.tool agent-control/results/task-001-control-plane-finalization.json >/dev/null
    - python3 scripts/check_control_state.py
    - bash scripts/test_control_state.sh
    - git diff --check
    - >
      python3 - <<'PY'
      import json, sys
      p='agent-control/results/task-001-control-plane-finalization.json'
      d=json.load(open(p)); t=json.dumps(d).lower()
      assert d.get('status') == 'candidate_complete'
      assert d.get('reviewer_status') == 'changes_addressed_pending_review'
      assert 'f5bf66957f9d44b665ec3969a2d18cc4a501ec9c' in json.dumps(d)
      if 'main restoration pending' in t:
          sys.exit('stale main-restoration statement remains')
      PY
    - >
      python3 - <<'PY'
      import subprocess, sys
      allowed={'scripts/check_control_state.py','scripts/test_control_state.sh','agent-control/results/task-001-control-plane-finalization.json'}
      changed=set(subprocess.check_output(['git','diff','--name-only','20d79b5a2ba93284a6f6246e4fae54a1e81a0c56...HEAD'],text=True).splitlines())
      bad=sorted(changed-allowed)
      if bad: print('\n'.join(bad)); sys.exit(1)
      PY
