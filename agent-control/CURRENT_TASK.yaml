repair_requirements:
  repair_1_implement_missing_tests:
    description: >
      Add 5 negative tests plus 1+ positive tests to reach minimum 21 total
      (2 positive + 19 negative)
    new_negative_tests:
      - source-grounded action with zero material_citations
      - arbitrary property inside bounded nested object
      - nullable type whose enum omits null
      - cannot_articulate in core obstacle_classification enum
      - undefined obstacle classification or missing explicit route
    new_positive_tests:
      - cannot_articulate + null obstacle + in_scope + diagnostic action with citations
      - stop-action cross-object rule compliance
    requirements:
      - retain all existing 15 tests
      - minimum 21 total tests (2 positive + 19 negative)
      - operate only on temporary fixtures
      - verify live files unchanged
      - no network calls

  repair_2_strengthen_structural_validation:
    description: >
      Update scripts/validate_task_002.py to structurally verify schema constraints,
      not just search for keywords
    structural_checks:
      - obstacle_classification enum exactly 6 strings plus null
      - cannot_articulate absent from obstacle enum
      - obsolete outside_corpus absent entirely
      - material_scope_status exactly 3 values
      - articulation_status exactly 2 values
      - all bounded nested objects have additionalProperties: false
      - every nullable enum includes null
      - Draft-07 citation condition exists
      - five source-grounded actions require minItems >= 1
      - stop action with empty citations requires non-empty stop_reason
      - all declared obstacle and auxiliary-status routes explicitly defined

  repair_3_enforce_cross_object_stop_rule:
    description: >
      For stop_and_request_more_material with empty citations, require both:
      action_details.stop_reason non-empty AND material_scope_status not in_scope
    implementation:
      - use Draft-07 top-level if/then or smallest valid refactor
      - add instance-level tests executing schema validation
      - empty citations valid only when material_scope_status is
        missing_required_material or outside_supplied_corpus
      - invalid when material_scope_status is in_scope even with stop_reason

  repair_4_update_design_gates:
    description: Update DESIGN_GATES.md to reflect Protocol 18 state
    changes:
      - remove stale Task 001 Stage 3 active-state metadata
      - Protocol 18
      - Gate 2: candidate_complete, independent_review=pending,
        exit_conditions_accepted=false, blocked_by=independent_review
      - Gate 3: not_started, blocked_by=gate_2_independent_review
      - update validator description
      - update test counts (positive/negative/total)
      - update current task ID
      - update review status
      - update footer/last-updated metadata
      - do not mark Gate 2 formally accepted

  repair_5_repair_result_and_authority_metadata:
    description: Align all three authority files to candidate_complete state
    changes:
      - task_id: task-002-gate-2-test-and-audit-closure
      - status: candidate_complete
      - lifecycle all fields aligned
      - baseline: 11fa64efb62caf1ceca78a3b20595d003f4ee037
      - completion_commit from C1
      - completed_at from C1 exact Git committer timestamp
      - timestamp_source: git_committer_metadata
      - complete changed-path list including CURRENT_TASK.yaml
      - actual validator check count
      - actual positive/negative/total test counts
      - every final validation command and actual exit code
      - next_action: awaiting independent Protocol 18 review
      - reviewer_acceptance: pending
      - Gate 3: not_started
      - no stale Protocol 16/17 text or counts

  repair_6_replace_pr_body:
    description: Update PR #3 body with Protocol 18 status
    required_content:
      - Protocol 18
      - contract publication commit
      - C1, C2, any C3
      - final head
      - actual changed files
      - actual test counts
      - every acceptance command and exit code
      - reviewer acceptance pending
      - Gate 2 not formally accepted
      - Gate 3 not started

acceptance_commands:
  - python3 -m json.tool templates/MINIMAL_LEARNING_STATE.schema.json >/dev/null
  - python3 -m json.tool agent-control/results/task-002.json >/dev/null
  - python3 scripts/validate_task_002.py
  - bash scripts/test_task_002_negative.sh
  - python3 scripts/check_control_state.py
  - git diff --check
  - grep -q '^# First Vertical Scenario' docs/FIRST_VERTICAL_SCENARIO.md
  - grep -q '^# Pedagogical Action Decision Tree' docs/PEDAGOGICAL_ACTION_DECISION_TREE.md
  - >
    python3 - <<'PY'
    import subprocess, sys
    allowed = {
        'agent-control/CURRENT_TASK.yaml',
        'docs/PEDAGOGICAL_ACTION_DECISION_TREE.md',
        'docs/DESIGN_GATES.md',
        'templates/MINIMAL_LEARNING_STATE.schema.json',
        'scripts/validate_task_002.py',
        'scripts/test_task_002_negative.sh',
        'state/CURRENT_STATE.yaml',
        'agent-control/results/task-002.json',
    }
    changed = set(subprocess.check_output(
        ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
    ).splitlines())
    bad = sorted(changed - allowed)
    if bad:
        print('\n'.join(bad))
        sys.exit(1)
    PY

